<!DOCTYPE html>

<head>
    <!-- Metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A website about cloud software development with floating cloud effects.">
    <title>Cloud Software Developer</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="Earp_Justin_Stylesheet.css">

    <style>
        /* Cloud Background Container */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #87CEEB; /* Sky blue */
            overflow: hidden; /* Prevent scrollbars from appearing */
        }

        .cloud {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: -15px -15px 30px rgba(255, 255, 255, 0.8), 
                        -15px 15px 30px rgba(255, 255, 255, 0.8), 
                        15px 15px 30px rgba(255, 255, 255, 0.8), 
                        15px -15px 30px rgba(255, 255, 255, 0.8);
            animation: floatClouds 30s linear infinite;
        }

        /* Cloud shapes */
        .cloud1 { width: 200px; height: 100px; top: 50px; left: -250px; }
        .cloud2 { width: 150px; height: 75px; top: 150px; left: -200px; animation-delay: 5s; }
        .cloud3 { width: 250px; height: 125px; top: 300px; left: -300px; animation-delay: 10s; }
        .cloud4 { width: 180px; height: 90px; top: 400px; left: -180px; animation-delay: 15s; }

        /* Cloud animation */
        @keyframes floatClouds {
            0% {
                transform: translateX(0);
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateX(100vw);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Floating Clouds -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
