<h1>Justin Earp</h1>
<p id="browser-info"></p> <!-- Browser Information Display-->
<hr>
<script>
    let browserName = navigator.appName;
    let browserVersion = navigator.appVersion;

    document.write("<h1>Browser Information</h1>");
    document.write("<p><strong>You are using the following browser:</strong> " + browserName + "</p>");
    document.write("<p><strong>You are using the following version of this browser:</strong> " + browserVersion + "</p>");
</script>
</body>
